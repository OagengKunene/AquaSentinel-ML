[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="aquasentinel-ml"
version="0.1.0"
description="Explainable machine learning for water-quality screening"
requires-python=">=3.11"
dependencies=["numpy>=1.26,<3","pandas>=2.1,<3","scikit-learn>=1.4,<2","joblib>=1.3,<2","fastapi>=0.110,<1","pydantic>=2.6,<3"]

[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
